<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>User Category Management — Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- removed at migration: dead reference (stylesheet did not exist in the source folder either) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">

    <!-- Moderates — editable -->
    <div class="moderates-section">
      <div class="section-header">
        <h6>Moderates</h6>
        <button id="editBtn-1" class="edit-btn" title="Edit moderation categories" aria-label="Edit moderation categories">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        </button>
      </div>
      <div id="chip-container-1" class="chip-container">
        <div class="chip">cs.AI</div>
        <div class="chip">math.CO</div>
        <div class="chip">physics.optics</div>
      </div>
    </div>

    <!-- Can Submit To — lookup only, not configurable -->
    <div class="moderates-section">
      <h6>Can Submit To</h6>
      <div id="chip-container-2" class="chip-container">
        <div class="chip">cs.LG</div>
        <div class="chip">stat.ML</div>
      </div>
    </div>

    <!-- Is Endorsed For — editable; chips annotated with endorsement source -->
    <div class="moderates-section">
      <div class="section-header">
        <h6>Is Endorsed For</h6>
        <button id="editBtn-3" class="edit-btn" title="Edit endorsed categories" aria-label="Edit endorsed categories">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        </button>
      </div>
      <div id="chip-container-3" class="chip-container">
        <div class="chip">cs.CV</div>
        <div class="chip">physics.bio-ph</div>
      </div>
    </div>

    <!-- Can Endorse For — lookup only, not configurable -->
    <div class="moderates-section">
      <h6>Can Endorse For</h6>
      <div id="chip-container-4" class="chip-container">
        <div class="chip">math.AP</div>
      </div>
    </div>

  </main>

  <!-- Modal: Moderation Categories -->
  <div id="modal-1" class="modal" hidden>
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Moderation Categories</h2>
        <button id="closeModal-1" class="close-btn" aria-label="Close">✕</button>
      </div>
      <div class="modal-current-selection">
        <p>Currently selected</p>
        <div id="modal-chip-display-1" class="chip-container"></div>
      </div>
      <div class="combobox" id="combobox-1">
        <div class="selected-row" id="selected-1"></div>
        <div class="search-container">
          <input id="combo-input-1" type="text" placeholder="Search to find and add new categories" aria-expanded="false" aria-haspopup="listbox" aria-controls="combo-list-1" autocomplete="off">
          <ul class="dropdown" id="combo-list-1" role="listbox"></ul>
        </div>
      </div>
      <div class="modal-actions">
        <button id="cancelBtn-1" class="cancel-btn">Cancel</button>
        <button id="saveBtn-1" class="save-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- Modal: Endorsed Categories -->
  <div id="modal-3" class="modal" hidden>
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Endorsed Categories</h2>
        <button id="closeModal-3" class="close-btn" aria-label="Close">✕</button>
      </div>
      <div class="modal-current-selection">
        <p>Currently selected</p>
        <div id="modal-chip-display-3" class="chip-container"></div>
      </div>
      <div class="combobox" id="combobox-3">
        <div class="selected-row" id="selected-3"></div>
        <div class="search-container">
          <input id="combo-input-3" type="text" placeholder="Search to find and add new categories" aria-expanded="false" aria-haspopup="listbox" aria-controls="combo-list-3" autocomplete="off">
          <ul class="dropdown" id="combo-list-3" role="listbox"></ul>
        </div>
      </div>
      <div class="modal-actions">
        <button id="cancelBtn-3" class="cancel-btn">Cancel</button>
        <button id="saveBtn-3" class="save-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- removed at migration: dead reference (script-multi.js did not exist in the source folder either) -->
</body>
</html>
