# The arxiv_brand package: the portable-Jinja templates and their schema, installed from git
# (README.md). Markup only: CSS, fonts, logos and chrome JS come from the asset route.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-brand-templates"
description = "arXiv brand head/header/footer as portable Jinja, installed from git."
# The git SHA in each consumer's lock is the version; this number stays put.
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["jinja2>=3"]

[tool.setuptools]
packages = ["arxiv_brand"]

[tool.setuptools.package-data]
arxiv_brand = ["*.html", "schema.json", "py.typed"]
