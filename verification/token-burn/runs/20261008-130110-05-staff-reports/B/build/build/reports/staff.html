<!doctype html>
<!-- Internal tool: moderation and staff reports. Signed-in moderators and
     arXiv staff only, so .ds-internal (Access Lime) on <html>. Shown as an
     arXiv staff member with admin permissions sees it. -->
<html lang="en" class="ds-internal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff reports — arXiv</title>
  <link rel="stylesheet" href="../../docs/fonts.css">
  <link rel="stylesheet" href="../../docs/design-system.css">    <!-- tier 1 -->
  <link rel="stylesheet" href="../../docs/internal-tools.css">   <!-- tier 2 -->
  <link rel="stylesheet" href="reports.css">
  <script src="../../docs/theme.js"></script>  <!-- not deferred: the theme must land before first paint -->
  <script src="../../docs/header.js" defer></script>
</head>
<body class="ds-page">
<a class="ds-skip-link" href="#main">Skip to main content</a>

<header class="ds-site-header">
  <a href="sections.html" class="ds-site-header-logo" aria-label="archive reports home">
    <img src="../../docs/assets/images/logos/logo_arxiv-primary.svg" alt="archive">
  </a>
  <nav class="ds-site-header-nav" id="ds-site-header-nav" aria-label="Reports">
    <a href="sections.html">Moderation reports</a>
    <a href="staff.html" aria-current="page">Staff reports</a>
  </nav>
  <span class="ds-site-header-divider" aria-hidden="true"></span>
  <div class="ds-site-header-account">
    <span class="ds-site-header-greeting">Welcome <b>Ada</b></span>
    <details class="ds-site-header-dropdown">
      <summary class="ds-site-header-login">Account</summary>
      <div class="ds-site-header-menu">
        <a href="/account">Your account</a>
        <!-- Log out changes state, so it posts (header.html); the only non-GET form. -->
        <form method="post" action="/logout">
          <button type="submit">Log out</button>
        </form>
      </div>
    </details>
  </div>
</header>

<main id="main" class="ds-container">
  <header class="ds-page-header">
    <h1>Staff reports</h1>
    <p>Choose a report.</p>
  </header>

  <!-- A page that sends the reader on: cards that link (layout-patterns). -->
  <div class="ds-card-grid">
    <div class="ds-card ds-card--link">
      <h2><a href="staff-user-activity.html">User activity</a></h2>
    </div>
    <div class="ds-card ds-card--link">
      <h2><a href="staff-section-health.html">Section health</a></h2>
    </div>
    <div class="ds-card ds-card--link">
      <h2><a href="staff-suspicious-activity.html">Suspicious activity</a></h2>
    </div>
    <div class="ds-card ds-card--link">
      <h2><a href="staff-sections.html">Sections</a></h2>
    </div>
    <div class="ds-card ds-card--link">
      <h2><a href="staff-moderators.html">Moderators</a></h2>
    </div>
  </div>
</main>

</body>
</html>
